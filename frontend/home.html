<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGames Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <div>
            <h1>MiniGames Hub</h1>
        </div>

        <div>
            <span id="nomeUsuario"></span>
            <button id="logout">
                Sair
            </button>
        </div>

    </header>
    <main>
        <section>
            <h2>Escolha um Minigame</h2>

            <p>
                Escolha um dos jogos abaixo para começar.
            </p>
        </section>

        <section class="cards">
            <article class="card">
                <img src="assets/imagens/survival.png"
                     alt="Survival Run">

                <h3>Survival Run</h3>

                <button id="btnSurvival">
                    Jogar
                </button>

            </article>

            <article class="card">

                <img src="assets/imagens/memoria.png"
                     alt="Memória">

                <h3>Jogo da Memória</h3>

                <button id="btnMemoria">
                    Jogar
                </button>

            </article>

            <article class="card">

                <img src="assets/imagens/alvo.png"
                     alt="Acerte o Alvo">

                <h3>Acerte o Alvo</h3>

                <button id="btnAlvo">

                    Jogar

                </button>

            </article>

        </section>

    </main>

    <footer>

    </footer>

    <script src="js/home.js"></script>

</body>

</html>
